services:
  postgres:
    container_name: postgres
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - '5430:5432'
    healthcheck:
      # -h forces a TCP check. While the seed files load, the entrypoint runs a
      # temporary server bound to the unix socket only, so a socket check goes
      # green while TCP is still refused and dbt fails to connect on startup.
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10
  dbt:
    container_name: dbt
    build: .
    volumes:
      - ./:/usr/src/dbt
    depends_on:
      postgres:
        condition: service_healthy
